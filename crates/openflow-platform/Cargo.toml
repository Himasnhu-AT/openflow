[package]
name = "openflow-platform"
version.workspace = true
edition.workspace = true
description = "OpenFlow OS integration: hotkey, field context, live typing, mic, call detection, sounds"

[dependencies]
openflow-core.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-segmentation = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-application-services = "0.3"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
cpal = "0.18"
rubato = "0.16"
base64 = "0.22"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = "0.3"
