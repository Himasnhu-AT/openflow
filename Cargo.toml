[workspace]
resolver = "2"
members = ["src-tauri", "crates/jez-core", "crates/jez-engines", "crates/jez-platform"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"

[workspace.dependencies]
jez-core = { path = "crates/jez-core" }
jez-engines = { path = "crates/jez-engines" }
jez-platform = { path = "crates/jez-platform" }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
fancy-regex = "0.14"
once_cell = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
futures-util = "0.3"
tracing = "0.1"
dirs = "6"
hound = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
