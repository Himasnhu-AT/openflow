<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 280px; margin: 0; padding: 14px 16px; font: 13px -apple-system, system-ui, sans-serif; color: #eee; background: #1c1c1e; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; flex: none; }
      .ok { background: #30d158; } .warn { background: #ff9f0a; } .bad { background: #ff453a; }
      .muted { color: #999; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>OpenFlow for Google Meet</h1>
    <div class="row"><span id="app-dot" class="dot"></span><span id="app">Checking OpenFlow…</span></div>
    <div class="row"><span id="meet-dot" class="dot"></span><span id="meet">Checking this tab…</span></div>
    <div id="detail" class="muted"></div>
    <script src="popup.js"></script>
  </body>
</html>
